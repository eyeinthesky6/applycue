title: "[Question] "
body:
  - type: markdown
    attributes:
      value: |
        Ask about ApplyCue setup, usage, or troubleshooting. Do not include a CV, name, contact details, credentials, application history, browser receipts, scan output, or generated candidate files. Use fictional or sanitized evidence only.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Installation and setup
        - Job discovery
        - Review and CV preparation
        - Dashboard and application flow
        - Other
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: What do you need help with?
      description: Explain what you tried, what you expected, and where you are blocked.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ApplyCue version or commit
      description: Share the output of git describe --tags --always when available.
      placeholder: ApplyCue-v0.1.0 or a commit hash
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Include the exact command and first blocker message without personal data.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed CVs, names, contact details, credentials, application history, browser receipts, scan output, and generated candidate files.
          required: true
