title: "[Contributor showcase] "
body:
  - type: markdown
    attributes:
      value: |
        Share a technical extension, integration, provider, development workflow, or reusable contributor lesson. Ordinary product feedback and user outcomes belong in the linked Telegram discussion group at https://t.me/applycue. Do not include candidate data, private account data, employer correspondence, or generated application files.
  - type: dropdown
    id: kind
    attributes:
      label: What are you sharing?
      options:
        - Provider or connector
        - Integration
        - Development workflow
        - Technical lesson
        - Other
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What worked, and what should improve?
      description: Explain the setup, useful result, limitation, or suggested improvement using fictional or sanitized details.
    validations:
      required: true
  - type: input
    id: public_link
    attributes:
      label: Optional public link
      description: Link only to material you are allowed to share publicly.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed CVs, names, contact details, credentials, application history, browser receipts, private employer messages, and generated candidate files.
          required: true
