title: "[Show and Tell] "
body:
  - type: markdown
    attributes:
      value: |
        Share honest, sanitized ApplyCue feedback, a review, a workflow, an integration, or an outcome that could help the community. Positive, mixed, and critical feedback are welcome. Do not include candidate data, private account data, employer correspondence, or generated application files.
  - type: dropdown
    id: kind
    attributes:
      label: What are you sharing?
      options:
        - Product feedback or review
        - Workflow
        - Integration
        - Outcome or lesson
        - Other
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What worked, and what should improve?
      description: Explain the setup, useful result, limitation, or suggested improvement using fictional or sanitized details.
    validations:
      required: true
  - type: input
    id: public_link
    attributes:
      label: Optional public link
      description: Link only to material you are allowed to share publicly.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed CVs, names, contact details, credentials, application history, browser receipts, private employer messages, and generated candidate files.
          required: true
