name: Bug Report
description: Report a bug in ApplyCue
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        > ⚠️ **Privacy first.** ApplyCue runs locally. **Never** paste your CV, scan results, pipeline data, job listings, or other personal info — issues are **public forever**. Keep your data on your machine; share only sanitized snippets.
  - type: checkboxes
    id: search
    attributes:
      label: Existing issues
      options:
        - label: I searched existing issues and this hasn't been reported yet
          required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
  - type: input
    id: cli
    attributes:
      label: CLI tool
      placeholder: "e.g., Claude Code, OpenCode, Codex"
  - type: input
    id: os
    attributes:
      label: OS and Node.js version
      placeholder: "e.g., macOS 15 / Node 20.11"
  - type: textarea
    id: status
    attributes:
      label: Sanitized output of pnpm applycue:status
      description: Remove names, paths, job details, and other personal information before pasting.
      render: shell
