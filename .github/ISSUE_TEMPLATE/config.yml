blank_issues_enabled: false
contact_links:
  - name: Ask a user question or share product feedback
    url: https://t.me/applycue
    about: Open the ApplyCue channel and use its linked discussion group. Never share CVs or personal application data.
  - name: Discuss a contributor design question
    url: https://github.com/eyeinthesky6/applycue/discussions
    about: Use GitHub Discussions for technical design, extensions, and contributor questions.
  - name: "📤 Sharing scan results or automation output?"
    url: https://github.com/eyeinthesky6/applycue/blob/main/DATA_CONTRACT.md
    about: Your scans and reports stay local (data/ + reports/). Please don't file them here — they'd be public, and they're not needed upstream. Point any scheduled run at your own fork.
  - name: Private security report
    url: https://github.com/eyeinthesky6/applycue/security/advisories/new
    about: Report a vulnerability privately; do not open a public issue.
