name: Plugin registration
description: Register your ApplyCue-plugin-<name> repo so it can be listed as an approved community plugin
labels: ["plugin-submission", "area:plugins"]
body:
  - type: markdown
    attributes:
      value: |
        > ⚠️ **Privacy first.** Never paste your CV, scan results, or other personal data — issues are **public forever**.

        This issue becomes your plugin's **home** (its changelog + compatibility/quarantine board). After it is filed, open a **registry PR** to list it. See [plugins/README.md](https://github.com/eyeinthesky6/applycue/blob/main/plugins/README.md).
  - type: checkboxes
    id: coc
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow the [Code of Conduct](https://github.com/eyeinthesky6/applycue/blob/main/CODE_OF_CONDUCT.md)
          required: true
  - type: input
    id: repo
    attributes:
      label: Repo URL
      description: Must be named `ApplyCue-plugin-<name>` (a public GitHub repo you own).
      placeholder: https://github.com/your-user/ApplyCue-plugin-greenhouse
    validations:
      required: true
  - type: input
    id: desc
    attributes:
      label: One-line description
      description: Mission-framed, what it does.
    validations:
      required: true
  - type: textarea
    id: hooks
    attributes:
      label: Hooks + keys + hosts
      description: Which hooks (provider/ingest/search/notify/export), which env keys it needs, which hosts it talks to.
    validations:
      required: true
  - type: checkboxes
    id: attest
    attributes:
      label: Attestations
      options:
        - label: It is human-in-the-loop — it never auto-submits an application
          required: true
        - label: It reads PUBLIC data or the user's OWN account only — no centralized infrastructure
          required: true
        - label: MIT-compatible license; no personal data in the repo
          required: true
        - label: Any paid or hosted dependency is disclosed clearly and never required silently
          required: true
