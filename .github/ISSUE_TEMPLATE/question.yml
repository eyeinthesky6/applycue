name: Setup or Usage Question
description: Ask for help installing or using ApplyCue
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        ApplyCue issues are public. Never paste a real CV, name, email, phone number, application history, browser receipt, credential, or generated application artifact. Use fictional or sanitized examples only.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed all candidate and account data from this report
          required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js version, and agent host
      placeholder: Windows 11, Node 24, Codex
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What are you trying to do, and where are you blocked?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Include the exact command and first blocker message without personal data.
      render: shell
