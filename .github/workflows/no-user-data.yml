name: No user data in PRs

# Hard-blocks any PR that adds or modifies user-layer (private data) files.
# These live ONLY on the candidate's machine per DATA_CONTRACT.md and must never
# enter the repo — they are personal job-search data. Fake fixtures belong in
# package and app tests. Uses the API (listFiles) so it works for fork PRs too.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number, per_page: 100,
            });

            // Current user/private paths. Removed legacy repo-local paths are not
            // supported user stores.
            const USER_PATHS = [
              /^\.applycue\//,
              /^assets\//,
              /^config\/applycue\.local\.json$/,
            ];
            // Tracked scaffolding that legitimately lives under those dirs.
            const isScaffold = (f) => /(^|\/)\.gitkeep$/.test(f) || /(^|\/)README\.md$/.test(f);

            const bad = files
              .filter((f) => f.status !== 'removed')
              .map((f) => f.filename)
              .filter((f) => USER_PATHS.some((re) => re.test(f)) && !isScaffold(f));

            if (bad.length) {
              core.setFailed(
                'This PR adds/modifies user-layer (private data) files. These live ONLY on your ' +
                'machine per DATA_CONTRACT.md and must never be committed — use test fixtures for ' +
                'sample data.\nOffending files:\n  ' + bad.join('\n  ')
              );
            } else {
              core.info('OK — no user-layer (private data) files touched.');
            }
