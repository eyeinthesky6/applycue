name: SBOM Generation
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing ApplyCue release tag to backfill
        required: true
        type: string
      require_draft:
        description: Refuse a published release (normally false for backfill)
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      tag:
        description: ApplyCue release tag created by the caller
        required: true
        type: string
      require_draft:
        description: Require the release to remain a draft while evidence is attached
        required: false
        default: true
        type: boolean
    outputs:
      release_id:
        description: GitHub release database id verified by the SBOM job
        value: ${{ jobs.sbom.outputs.release_id }}
      source_commit:
        description: Commit resolved from the exact release tag
        value: ${{ jobs.sbom.outputs.source_commit }}
      sbom_sha256:
        description: SHA-256 of the verified staged SBOM
        value: ${{ jobs.sbom.outputs.sbom_sha256 }}

permissions: {}

jobs:
  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.assets.outputs.release_id }}
      source_commit: ${{ steps.assets.outputs.commit }}
      sbom_sha256: ${{ steps.verify.outputs.sbom_sha256 }}
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          if [[ ! "$tag" =~ ^ApplyCue-v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid ApplyCue release tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Resolve release identity and existing assets
        id: assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          REQUIRE_DRAFT: ${{ inputs.require_draft }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          release_id="$(jq -r '.id' <<<"$release_json")"
          release_tag="$(jq -r '.tag_name' <<<"$release_json")"
          release_target="$(jq -r '.target_commitish' <<<"$release_json")"
          release_draft="$(jq -r '.draft' <<<"$release_json")"
          remote_tag_commit="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq '.sha')"

          [[ "$release_tag" == "$RELEASE_TAG" ]] || {
            echo "Resolved release tag does not match the requested tag." >&2
            exit 1
          }
          [[ "$release_target" == "$commit" ]] || {
            echo "Release target does not match the checked-out source commit." >&2
            exit 1
          }
          [[ "$remote_tag_commit" == "$commit" ]] || {
            echo "Remote release tag does not match the checked-out source commit." >&2
            exit 1
          }
          if [[ "$REQUIRE_DRAFT" == true && "$release_draft" != true ]]; then
            echo "The automatic evidence path requires a draft release." >&2
            exit 1
          fi

          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

          mkdir -p "$RUNNER_TEMP/existing-release-assets"
          sbom_exists=false
          receipt_exists=false

          if gh release download "$RELEASE_TAG" \
            --pattern ApplyCue-sbom.spdx.json \
            --dir "$RUNNER_TEMP/existing-release-assets"; then
            sbom_exists=true
          fi
          if gh release download "$RELEASE_TAG" \
            --pattern ApplyCue-release-evidence.txt \
            --dir "$RUNNER_TEMP/existing-release-assets"; then
            receipt_exists=true
          fi

          if [[ "$receipt_exists" == true && "$sbom_exists" != true ]]; then
            echo "Release evidence exists without its referenced SBOM; refusing to continue." >&2
            exit 1
          fi

          echo "sbom_exists=$sbom_exists" >> "$GITHUB_OUTPUT"
          echo "receipt_exists=$receipt_exists" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM (SPDX)
        if: steps.assets.outputs.sbom_exists != 'true'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        env:
          SYFT_SOURCE_NAME: ApplyCue
          SYFT_SOURCE_VERSION: ${{ steps.release.outputs.tag }}
          SYFT_SOURCE_SOURCE: https://github.com/${{ github.repository }}/tree/${{ steps.assets.outputs.commit }}
        with:
          artifact-name: ApplyCue-sbom.spdx.json
          format: spdx-json
          output-file: ApplyCue-sbom.spdx.json
          upload-release-assets: false

      - name: Build and verify release evidence
        id: evidence
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.assets.outputs.commit }}
          SBOM_EXISTS: ${{ steps.assets.outputs.sbom_exists }}
          RECEIPT_EXISTS: ${{ steps.assets.outputs.receipt_exists }}
        run: |
          set -euo pipefail
          if [[ "$SBOM_EXISTS" == true ]]; then
            cp "$RUNNER_TEMP/existing-release-assets/ApplyCue-sbom.spdx.json" .
          fi

          sbom_sha256="$(sha256sum ApplyCue-sbom.spdx.json | awk '{print $1}')"
          echo "sbom_sha256=$sbom_sha256" >> "$GITHUB_OUTPUT"
          cat > ApplyCue-release-evidence.txt <<EOF
          evidence_format=applycue-release-evidence-v1
          repository=https://github.com/${GITHUB_REPOSITORY}
          release_tag=${RELEASE_TAG}
          source_commit=${RELEASE_COMMIT}
          source_url=https://github.com/${GITHUB_REPOSITORY}/tree/${RELEASE_COMMIT}
          sbom_file=ApplyCue-sbom.spdx.json
          sbom_sha256=${sbom_sha256}
          EOF

          if [[ "$RECEIPT_EXISTS" == true ]]; then
            cmp ApplyCue-release-evidence.txt \
              "$RUNNER_TEMP/existing-release-assets/ApplyCue-release-evidence.txt" || {
              echo "Published release evidence does not match the tag, commit, and SBOM; refusing to overwrite it." >&2
              exit 1
            }
          fi

      - name: Upload missing release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SBOM_EXISTS: ${{ steps.assets.outputs.sbom_exists }}
          RECEIPT_EXISTS: ${{ steps.assets.outputs.receipt_exists }}
          RELEASE_ID: ${{ steps.assets.outputs.release_id }}
          REQUIRE_DRAFT: ${{ inputs.require_draft }}
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          [[ "$(jq -r '.id' <<<"$release_json")" == "$RELEASE_ID" ]] || {
            echo "Release identity changed before evidence upload." >&2
            exit 1
          }
          if [[ "$REQUIRE_DRAFT" == true && "$(jq -r '.draft' <<<"$release_json")" != true ]]; then
            echo "Release was published before its evidence was attached." >&2
            exit 1
          fi

          if [[ "$SBOM_EXISTS" != true ]]; then
            gh release upload "$RELEASE_TAG" \
              ApplyCue-sbom.spdx.json \
              ApplyCue-release-evidence.txt
          elif [[ "$RECEIPT_EXISTS" != true ]]; then
            gh release upload "$RELEASE_TAG" ApplyCue-release-evidence.txt
          else
            echo "The release SBOM and evidence are already present and consistent."
          fi

      - name: Verify attached release evidence
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_ID: ${{ steps.assets.outputs.release_id }}
          REQUIRE_DRAFT: ${{ inputs.require_draft }}
          EXPECTED_SBOM_SHA256: ${{ steps.evidence.outputs.sbom_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          [[ "$(jq -r '.id' <<<"$release_json")" == "$RELEASE_ID" ]] || {
            echo "Release identity changed after evidence upload." >&2
            exit 1
          }
          if [[ "$REQUIRE_DRAFT" == true && "$(jq -r '.draft' <<<"$release_json")" != true ]]; then
            echo "Release was published before staged evidence verification completed." >&2
            exit 1
          fi

          rm -rf "$RUNNER_TEMP/verified-release-assets"
          mkdir -p "$RUNNER_TEMP/verified-release-assets"
          gh release download "$RELEASE_TAG" \
            --pattern ApplyCue-sbom.spdx.json \
            --pattern ApplyCue-release-evidence.txt \
            --dir "$RUNNER_TEMP/verified-release-assets"
          cmp ApplyCue-sbom.spdx.json \
            "$RUNNER_TEMP/verified-release-assets/ApplyCue-sbom.spdx.json"
          cmp ApplyCue-release-evidence.txt \
            "$RUNNER_TEMP/verified-release-assets/ApplyCue-release-evidence.txt"

          actual_sbom_sha256="$(sha256sum "$RUNNER_TEMP/verified-release-assets/ApplyCue-sbom.spdx.json" | awk '{print $1}')"
          [[ "$actual_sbom_sha256" == "$EXPECTED_SBOM_SHA256" ]]
          echo "sbom_sha256=$actual_sbom_sha256" >> "$GITHUB_OUTPUT"
