name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.24.11
          cache: false
      - name: Install pinned Gitleaks CLI
        run: go install github.com/gitleaks/gitleaks/v8@v8.30.1
      - name: Scan reachable Git history
        run: gitleaks git --redact --verbose
