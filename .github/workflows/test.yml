name: Tests

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - run: node validate-system-paths-coverage.mjs
      - run: node test-all.mjs --quick
