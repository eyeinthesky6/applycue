name: Welcome

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

jobs:
  welcome:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          pr_message: |
            Welcome to ApplyCue, @${{ github.actor }}! Thanks for your first PR.

            A few things to know:
            - Tests will run automatically — check the status below
            - Keep real user CVs, job data, credentials, and generated artifacts out of the PR
            - Run `pnpm applycue:check`
            - Read [AGENTS.md](https://github.com/eyeinthesky6/applycue/blob/main/AGENTS.md) for architecture and workflow owners

            We'll review your PR soon. Use [SUPPORT.md](https://github.com/eyeinthesky6/applycue/blob/main/SUPPORT.md) for current help paths.
          issue_message: |
            Thanks for opening your first issue, @${{ github.actor }}! We'll take a look soon.

            In the meantime:
            - Check [SUPPORT.md](https://github.com/eyeinthesky6/applycue/blob/main/SUPPORT.md) for setup help
            - Check [SUPPORT.md](https://github.com/eyeinthesky6/applycue/blob/main/SUPPORT.md) for help
